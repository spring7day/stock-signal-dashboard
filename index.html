<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Signal Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 로그인 화면 -->
    <div id="login-screen" class="login-container">
        <div class="login-box">
            <h1>주식 신호등</h1>
            <input type="password" id="password-input" placeholder="비밀번호 입력" autocomplete="off">
            <button onclick="checkPassword()">로그인</button>
            <p class="error-msg" id="error-msg"></p>
        </div>
    </div>

    <!-- 메인 대시보드 -->
    <div id="main-dashboard" class="hidden">
        <header>
            <h1>주식 신호등</h1>
            <div class="header-info">
                <span id="last-update">마지막 업데이트: -</span>
                <button onclick="refreshAll()" class="icon-btn" id="refresh-btn" title="전체 새로고침" aria-label="전체 새로고침">↻</button>
                <button onclick="toggleCompactMode()" class="icon-btn" id="compact-toggle" title="간단보기 전환" aria-label="간단보기 전환">▦</button>
                <button onclick="logout()" class="icon-btn" title="로그아웃" aria-label="로그아웃">⎋</button>
            </div>
        </header>

        <div class="container">
            <!-- 종목 추가 섹션 -->
            <div class="add-stock-section">
                <h2>종목 추가</h2>
                <div class="add-stock-form">
                    <div class="search-container">
                        <input type="text" id="search-input" placeholder="🔍 종목명 또는 종목코드 검색 (예: 삼성전자, Apple, TSLA)" autocomplete="off">
                        <div id="search-results" class="search-results hidden"></div>
                    </div>
                </div>

                <!-- 매수(초록) 신호 티커 -->
                <div id="buy-ticker" class="buy-ticker hidden" aria-label="매수 신호 종목 티커">
                    <div class="buy-ticker-track" id="buy-ticker-track"></div>
                </div>

                <p class="hint">💡 종목명을 입력하면 자동으로 검색됩니다. 선택하시면 바로 추가됩니다.</p>
            </div>

            <!-- 신호등 대시보드 -->
            <div id="stocks-container" class="stocks-grid">
                <!-- 동적으로 생성됩니다 -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
